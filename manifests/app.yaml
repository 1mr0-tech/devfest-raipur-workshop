# Demo "shop" app. Healthy by default; faults are injected by `make break-1/2`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels: {app: cart}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cart}
  template:
    metadata:
      labels: {app: cart}
    spec:
      containers:
      - name: cart
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          if [ -z "$DB_HOST" ]; then
            echo "FATAL: DB_HOST is not set, cannot reach database" >&2
            exit 1
          fi
          echo "cart connected to $DB_HOST"
          sleep 3600
        env:
        - name: DB_HOST
          value: "postgres.shop.svc.cluster.local"
---
# Report generator. MODE=light is healthy. MODE=full buffers everything in memory
# and gets OOMKilled by its 64Mi limit (used by `npm run break-3`).
# (`tail /dev/zero` never sees a newline, so it buffers until killed. Kept out of
# the script itself so the agent cannot read the answer from the live deployment.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report
  labels: {app: report}
spec:
  replicas: 1
  selector:
    matchLabels: {app: report}
  template:
    metadata:
      labels: {app: report}
    spec:
      containers:
      - name: report
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          if [ "$MODE" = "full" ]; then
            tail /dev/zero
          fi
          echo "report generator ready (mode=$MODE)"
          sleep 3600
        env:
        - name: MODE
          value: "light"
        resources:
          limits: {memory: 64Mi}
